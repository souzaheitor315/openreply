# OpenReply on a single Oracle Cloud Always Free Ubuntu VM.
# Copy oracle.env.example to .env, fill all required secrets, and run:
# sudo docker compose -f docker-compose.oracle.yml up -d --build
# Only Caddy exposes host ports. Postgres and Redis stay on Docker's private network.
name: openreply
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: openreply
      POSTGRES_USER: openreply
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U openreply -d openreply"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  web:
    build:
      context: .
    image: openreply-oracle:local
    restart: unless-stopped
    env_file: .env
    command: ["sh", "-c", "npx prisma migrate deploy && npm run start"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:3000/login || exit 1"]
      interval: 15s
      timeout: 10s
      start_period: 90s
      retries: 8

  worker:
    image: openreply-oracle:local
    restart: unless-stopped
    env_file: .env
    command: ["npm", "run", "worker"]
    depends_on:
      web:
        condition: service_healthy

  cron:
    image: openreply-oracle:local
    restart: unless-stopped
    env_file: .env
    environment:
      CRON_BASE_URL: http://web:3000
    command: ["sh", "scripts/cron.sh"]
    depends_on:
      web:
        condition: service_healthy

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      SITE_DOMAIN: ${SITE_DOMAIN:?Set SITE_DOMAIN in .env}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile.oracle:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      web:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:
  caddy_data:
  caddy_config:
